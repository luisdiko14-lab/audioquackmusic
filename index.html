<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domain Setup</title>

<style>
body {
    margin: 0;
    background: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

.card {
    background: white;
    width: 90%;
    max-width: 520px;
    padding: 30px;
    border-radius: 8px;
    border: 1px solid #e5e5e5;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}

.logo {
    color: #f48120;
    font-weight: 600;
    margin-bottom: 10px;
}

h1 {
    font-size: 18px;
    margin-bottom: 8px;
}

p {
    font-size: 14px;
    color: #6b7280;
}

.bar {
    margin-top: 15px;
    height: 6px;
    background: #e5e7eb;
    border-radius: 4px;
    overflow: hidden;
}

.progress {
    height: 100%;
    width: 0%;
    background: #f48120;
}

.percent {
    text-align: right;
    font-size: 12px;
    color: #9ca3af;
    margin-top: 5px;
}

.logs {
    margin-top: 20px;
    height: 140px;
    overflow: hidden;
    border: 1px solid #e5e7eb;
    background: #fafafa;
    padding: 10px;
    border-radius: 6px;
    font-size: 12px;
}

.log-line::before {
    content: "• ";
    color: #f48120;
}

.footer {
    margin-top: 15px;
    text-align: center;
    font-size: 11px;
    color: #9ca3af;
}
</style>
</head>
<body>

<div class="card">
    <div class="logo">Cloudflare</div>

    <h1>Registering domain</h1>
    <p>aqmusic.app is being configured. Please wait.</p>

    <div class="bar">
        <div class="progress" id="progress"></div>
    </div>

    <div class="percent" id="percent">0%</div>

    <div class="logs" id="logs"></div>

    <div class="footer">
        Performance & security by Cloudflare<br>
        Verified by Vercel
    </div>
</div>

<script>
// ===== LOAD STATE (storage.json simulation) =====
let state = JSON.parse(localStorage.getItem("storage.json")) || {
    progress: 0,
    logs: []
};

// ===== ELEMENTS =====
const progressBar = document.getElementById("progress");
const percentText = document.getElementById("percent");
const logsDiv = document.getElementById("logs");

// ===== LOGS BY % =====
const progressLogs = {
    5: "Connecting to registrar...",
    10: "Domain reserved successfully",
    15: "Provisioning DNS records...",
    20: "Uploading configuration to Cloudflare...",
    30: "Applying edge network rules...",
    40: "Generating SSL certificate...",
    50: "Deploying to global network...",
    60: "Checking propagation status...",
    70: "Optimizing routing paths...",
    80: "Syncing edge nodes worldwide...",
    90: "Final validation checks...",
    100: "Setup complete"
};

// ===== RENDER SAVED =====
function render() {
    progressBar.style.width = state.progress + "%";
    percentText.textContent = state.progress.toFixed(1) + "%";

    logsDiv.innerHTML = "";
    state.logs.forEach(log => {
        const div = document.createElement("div");
        div.className = "log-line";
        div.textContent = log;
        logsDiv.appendChild(div);
    });

    logsDiv.scrollTop = logsDiv.scrollHeight;
}

// ===== SAVE STATE =====
function save() {
    localStorage.setItem("storage.json", JSON.stringify(state));
}

// ===== UPDATE PROGRESS =====
function updateProgress() {
    if (state.progress < 100) {
        state.progress += 1.2;
        if (state.progress > 100) state.progress = 100;

        let rounded = Math.floor(state.progress);

        // Add logs only once per milestone
        if (progressLogs[rounded] && !state.logs.includes(progressLogs[rounded])) {
            state.logs.push(progressLogs[rounded]);
        }

        render();
        save();
    }
}

// ===== INIT =====
render();

// SUPER slow (35s)
setInterval(updateProgress, 35000);
</script>

</body>
</html>
